<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pretty Jirah's Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7F1;
    --blush:#FFDCE3;
    --blush-soft:#FFEAEF;
    --rose:#FF7A93;
    --crimson:#E4485F;
    --cocoa:#6B4A3F;
    --cocoa-dark:#4A3128;
    --ink:#3D2630;
    --gold:#F4C669;
    --night:#2B2440;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 10px;
    --shadow-soft: 0 10px 30px rgba(107,74,63,0.18);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, #FFF0E9 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #FFE4EC 0%, transparent 45%),
      var(--cream);
    font-family:'Nunito', sans-serif;
    color: var(--ink);
    overflow-x:hidden;
  }

  h1,h2,h3, .display{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    margin:0;
  }

  button{ font-family:inherit; cursor:pointer; border:none; }

  .hidden{ display:none !important; }

  /* ---------- LANDING ---------- */
  #landing{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 20px;
    position:relative;
    overflow:hidden;
  }

  .petals{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-40px;
    opacity:0.85;
    animation-name: petal-fall;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes petal-fall{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.85; }
    90%{ opacity:0.6; }
    100%{ transform: translateY(110vh) translateX(24px) rotate(280deg); opacity:0; }
  }

  .sparkle{
    position:absolute;
    color: var(--gold);
    font-size:0.9rem;
    opacity:0.8;
  }

  .door-row{
    display:flex;
    align-items:flex-end;
    gap:14px;
    margin:38px 0 30px;
  }

  .planter{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:6px;
  }
  .planter .blooms{
    font-size:1.8rem;
    line-height:1;
    transform-origin: bottom center;
    animation: sway 3.4s ease-in-out infinite;
  }
  .planter.planter-right .blooms{ animation-delay: 0.7s; }
  @keyframes sway{
    0%, 100%{ transform: rotate(-7deg); }
    50%{ transform: rotate(7deg); }
  }
  .planter .stem{
    width:3px;
    height:18px;
    background: #8AA05B;
    margin:1px 0 0;
  }
  .planter .pot{
    width:34px; height:26px;
    background: linear-gradient(160deg, var(--rose), var(--crimson));
    border-radius: 4px 4px 10px 10px;
    box-shadow: var(--shadow-soft);
  }

  .sign-ribbon{
    background: var(--crimson);
    color: var(--cream);
    padding:8px 22px;
    border-radius:999px;
    font-size:0.85rem;
    letter-spacing:0.3px;
    margin-bottom:18px;
    box-shadow: var(--shadow-soft);
  }

  #landing h1{
    font-size:clamp(2.2rem, 6vw, 3.6rem);
    color: var(--crimson);
    line-height:1.15;
    max-width:14ch;
  }

  #landing p.sub{
    margin-top:14px;
    font-size:1.05rem;
    color: var(--cocoa);
    max-width:36ch;
  }

  .door-wrap{
    width:180px;
    height:230px;
    position:relative;
  }

  .door-frame{
    position:absolute;
    inset:0;
    background: var(--cocoa);
    border-radius: 90px 90px 14px 14px;
    box-shadow: var(--shadow-soft);
  }

  .door{
    position:absolute;
    top:10px; left:10px; right:10px; bottom:10px;
    background: linear-gradient(160deg, var(--rose), var(--crimson));
    border-radius: 80px 80px 8px 8px;
    transition: transform 0.7s cubic-bezier(.6,-0.28,.74,.05);
    transform-origin: left center;
  }

  .door::after{
    content:"";
    position:absolute;
    right:16px; top:50%;
    width:10px; height:10px;
    background: var(--gold);
    border-radius:50%;
    transform: translateY(-50%);
  }

  .door-glow{
    position:absolute;
    top:26px; left:26px; right:26px; bottom:26px;
    border-radius:60px 60px 4px 4px;
    background: rgba(255,255,255,0.18);
  }

  #landing.opening .door{
    transform: rotateY(-100deg);
  }

  .password-gate{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .password-input{
    font-family:'Nunito', sans-serif;
    font-size:0.95rem;
    text-align:center;
    padding:10px 20px;
    border-radius:999px;
    border:2px solid var(--blush);
    background: var(--cream);
    color: var(--ink);
    width:220px;
    max-width:70vw;
  }
  .password-input:focus{ outline:none; border-color:var(--rose); }
  .password-error{
    color: var(--crimson);
    font-size:0.8rem;
    min-height:1.1em;
  }
  @keyframes shakeX{
    10%,90%{ transform: translateX(-4px); }
    20%,80%{ transform: translateX(4px); }
    30%,50%,70%{ transform: translateX(-6px); }
    40%,60%{ transform: translateX(6px); }
  }
  .password-input.shake{ animation: shakeX 0.4s ease; }

  .enter-btn{
    background: var(--crimson);
    color:var(--cream);
    font-family:'Fredoka', sans-serif;
    font-size:1.05rem;
    padding:14px 38px;
    border-radius:999px;
    box-shadow: var(--shadow-soft);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .enter-btn:hover{ transform: translateY(-2px) scale(1.03); box-shadow:0 14px 34px rgba(228,72,95,0.32); }
  .enter-btn:active{ transform: translateY(0) scale(0.99); }

  /* ---------- CAFE SCENE ---------- */
  #cafe-scene{
    min-height:100vh;
    padding: 26px 16px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    animation: fadein 0.8s ease forwards;
  }
  @keyframes fadein{ to{ opacity:1; } }

  .scene-header{
    text-align:center;
    margin-bottom:18px;
  }
  .scene-header h2{ color:var(--crimson); font-size:1.6rem; }
  .scene-header p{ margin:6px 0 0; color:var(--cocoa); font-size:0.95rem; }

  .room{
    position:relative;
    width:100%;
    max-width:900px;
    aspect-ratio: 16 / 10;
    background:
      linear-gradient(180deg, var(--blush-soft) 0%, var(--blush-soft) 68%, #F2D9C4 68%, #E9C8AE 100%);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    overflow:hidden;
    background-image:
      radial-gradient(circle, rgba(255,122,147,0.10) 2px, transparent 2px),
      linear-gradient(180deg, var(--blush-soft) 0%, var(--blush-soft) 68%, #F2D9C4 68%, #E9C8AE 100%);
    background-size: 26px 26px, auto;
  }

  .hotspot{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:none;
    transition: transform 0.18s ease;
  }
  .hotspot:hover{ transform: scale(1.06); }
  .hotspot:active{ transform: scale(0.97); }

  .hotspot .label-chip{
    background: var(--cream);
    color: var(--cocoa-dark);
    font-size:0.7rem;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
    box-shadow:0 4px 10px rgba(107,74,63,0.16);
    white-space:nowrap;
  }

  .hotspot svg{ display:block; width:100%; height:auto; filter: drop-shadow(0 6px 10px rgba(107,74,63,0.22)); }

  /* window */
  .obj-window{ top:6%; left:6%; width:26%; }

  /* corkboard */
  .obj-board{ top:6%; right:6%; width:28%; }

  /* table */
  .obj-table{ bottom:14%; left:50%; transform:translateX(-50%); width:22%; }
  .obj-table:hover{ transform: translateX(-50%) scale(1.06); }
  .obj-table:active{ transform: translateX(-50%) scale(0.97); }

  /* jukebox */
  .obj-jukebox{ bottom:6%; left:8%; width:15%; }

  /* chair with teddy bear */
  .obj-chair{ bottom:6%; left:27%; width:15%; }

  /* treasure chest */
  .obj-claw{ bottom:8%; right:8%; width:23%; }

  /* ---------- MODAL ---------- */
  #modal-overlay{
    position:fixed; inset:0;
    background: rgba(61,38,48,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
    animation: fadein 0.2s ease;
  }
  #modal-panel{
    background: var(--cream);
    border-radius: var(--radius-lg);
    max-width:560px;
    width:100%;
    max-height:86vh;
    overflow-y:auto;
    padding:28px 26px 30px;
    position:relative;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }
  #modal-close{
    position:absolute;
    top:14px; right:14px;
    width:34px; height:34px;
    border-radius:50%;
    background: var(--blush);
    color: var(--crimson);
    font-size:1.1rem;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  #modal-body h3{
    color:var(--crimson);
    font-size:1.35rem;
    margin-bottom:4px;
  }
  #modal-body .modal-sub{
    color:var(--cocoa);
    font-size:0.9rem;
    margin-bottom:18px;
  }

  /* ----- star map modal ----- */
  .starmap-box{
    background: linear-gradient(180deg, var(--night), #191428);
    border-radius: var(--radius-md);
    aspect-ratio: 4/3;
    position:relative;
    overflow:hidden;
  }
  .constellation-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  .constellation-svg line{
    stroke: var(--gold);
    stroke-width:0.5;
    stroke-linecap:round;
    opacity:0.7;
  }
  .constellation-reveal{
    margin-top:12px;
    background: linear-gradient(160deg, var(--rose), var(--crimson));
    color: var(--cream);
    border-radius: var(--radius-sm);
    padding:14px 16px;
    text-align:center;
    display:none;
  }
  .constellation-reveal.show{ display:block; }
  .constellation-reveal .c-name{
    font-family:'Fredoka', sans-serif;
    font-size:1.1rem;
    margin-bottom:2px;
  }
  .constellation-reveal .c-sub{ font-size:0.8rem; opacity:0.9; }
  .star-btn{
    position:absolute;
    background:none;
    color:#F4E9C9;
    font-size:1.5rem;
    padding:0;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    filter: drop-shadow(0 0 3px rgba(244,233,201,0.6));
    transform: translate(-50%, -50%);
    transition: transform 0.2s ease, color 0.2s ease;
  }
  .star-btn.found{ color: var(--gold); transform: translate(-50%, -50%) scale(1.3); }
  .bg-star{
    position:absolute;
    color:#F4E9C9;
    opacity:0.5;
    pointer-events:none;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:0.2; }
    50%{ opacity:0.75; }
  }
  .star-caption{
    margin-top:14px;
    background: var(--blush-soft);
    border-radius: var(--radius-sm);
    padding:12px 14px;
    font-size:0.95rem;
    min-height:48px;
  }
  .star-progress{
    text-align:right;
    font-size:0.8rem;
    color:var(--cocoa);
    margin-top:6px;
  }

  /* ----- mixtape modal ----- */
  .track-row{
    display:flex;
    align-items:center;
    gap:12px;
    background: var(--blush-soft);
    border-radius: var(--radius-sm);
    padding:10px 14px;
    margin-bottom:8px;
    transition: background 0.15s ease;
  }
  .track-row.active{ background: var(--blush); }
  .track-play{
    width:34px; height:34px;
    border-radius:50%;
    background: var(--crimson);
    color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .track-meta{ flex:1; }
  .track-meta .t-title{ font-weight:700; font-size:0.92rem; }
  .track-meta .t-artist{ font-size:0.8rem; color:var(--cocoa); }
  .eq{ display:flex; gap:2px; align-items:flex-end; height:16px; }
  .eq span{ width:3px; background:var(--crimson); border-radius:2px; animation: eqbar 0.9s ease-in-out infinite; }
  .eq span:nth-child(2){ animation-delay:0.15s; }
  .eq span:nth-child(3){ animation-delay:0.3s; }
  @keyframes eqbar{ 0%,100%{ height:4px;} 50%{ height:15px; } }
  .now-caption{
    margin-top:14px;
    background:var(--blush-soft);
    border-radius:var(--radius-sm);
    padding:14px;
    font-size:0.95rem;
    min-height:50px;
  }
  .upload-note{
    margin-top:10px;
    font-size:0.75rem;
    color:#b98a5a;
    background:#fff3e0;
    padding:8px 10px;
    border-radius:8px;
  }
  .track-progress-wrap{ margin-top:10px; }
  .track-progress-bar{
    width:100%;
    height:6px;
    background: var(--blush);
    border-radius:999px;
    overflow:hidden;
    cursor:pointer;
  }
  .track-progress-fill{
    height:100%;
    width:0%;
    background: var(--crimson);
    transition: width 0.1s linear;
  }
  .track-time{
    font-size:0.7rem;
    color: var(--cocoa);
    margin-top:4px;
    text-align:right;
  }
  .mixtape-tabs{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .mixtape-tab{
    flex:1;
    background: var(--blush-soft);
    color: var(--cocoa-dark);
    font-family:'Fredoka', sans-serif;
    font-size:0.72rem;
    line-height:1.25;
    padding:8px 6px;
    border-radius:12px;
    text-align:center;
  }
  .mixtape-tab.active{
    background: var(--crimson);
    color: var(--cream);
  }

  /* ----- tarot modal (deck + 3-card draw) ----- */
  .tarot-deck-wrap{
    display:flex;
    justify-content:center;
    margin:12px 0 4px;
  }
  .tarot-deck{ position:relative; width:70px; height:100px; }
  .deck-card{
    position:absolute; inset:0;
    background: linear-gradient(160deg, var(--rose), var(--crimson));
    border-radius:10px;
    box-shadow:0 4px 8px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
    color: var(--cream);
    font-size:1.3rem;
  }
  @keyframes deckShake{
    0%,100%{ transform: scale(1) rotate(0deg); }
    25%{ transform: scale(1.04) rotate(-4deg); }
    50%{ transform: scale(0.97) rotate(4deg); }
    75%{ transform: scale(1.04) rotate(-3deg); }
  }
  .tarot-deck.shaking .deck-card{ animation: deckShake 0.5s ease; }

  .tarot-draw-row{
    display:flex;
    gap:14px;
    justify-content:center;
    margin-top:18px;
    flex-wrap:wrap;
    min-height:170px;
  }
  .tarot-card{
    width:110px; height:160px;
    perspective:800px;
    cursor:pointer;
  }
  @keyframes dealIn{
    0%{ opacity:0; transform: translateY(24px) scale(0.85); }
    100%{ opacity:1; transform: translateY(0) scale(1); }
  }
  .tarot-card.deal-in{ animation: dealIn 0.4s ease both; }
  .tarot-inner{
    width:100%; height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition: transform 0.6s cubic-bezier(.6,.05,.3,1.3);
  }
  .tarot-card.flipped .tarot-inner{ transform: rotateY(180deg); }
  .tarot-face{
    position:absolute; inset:0;
    border-radius:14px;
    backface-visibility:hidden;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:10px;
    box-shadow: var(--shadow-soft);
  }
  .tarot-back{
    background: linear-gradient(160deg, var(--rose), var(--crimson));
    color: var(--cream);
    font-size:1.8rem;
  }
  .tarot-front{
    background: var(--cream);
    border:2px solid var(--blush);
    transform: rotateY(180deg);
    flex-direction:column;
    gap:6px;
  }
  .tarot-front .tf-icon{ font-size:1.6rem; }
  .tarot-front .tf-name{ font-family:'Fredoka',sans-serif; font-weight:600; color:var(--crimson); font-size:0.85rem; }
  .tarot-front .tf-text{ font-size:0.72rem; color:var(--cocoa-dark); line-height:1.3; }
  .shuffle-btn{
    display:block;
    margin:14px auto 0;
    background: var(--crimson);
    color: var(--cream);
    font-family:'Fredoka', sans-serif;
    padding:8px 24px;
    border-radius:999px;
    font-size:0.85rem;
    box-shadow: var(--shadow-soft);
  }
  .shuffle-btn:disabled{ opacity:0.6; }

  /* ----- notes app modal (corkboard) ----- */
  .corkboard{
    position:relative;
    background:
      radial-gradient(circle, rgba(0,0,0,0.12) 1.5px, transparent 1.5px),
      linear-gradient(160deg, #A9744F, #8A5B3B);
    background-size: 14px 14px, auto;
    border-radius: var(--radius-md);
    aspect-ratio: 4/3;
    overflow:hidden;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
  }
  .sticky-note{
    position:absolute;
    width:24%;
    aspect-ratio:1;
    border-radius:4px;
    box-shadow:0 6px 12px rgba(0,0,0,0.28);
    padding:10%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:0.72rem;
    color: var(--cocoa-dark);
    transition: filter 0.15s ease;
  }
  .sticky-note:hover{ filter: brightness(1.04); }
  .sticky-pin{
    position:absolute;
    top:-5px; left:50%;
    transform: translateX(-50%);
    width:9px; height:9px;
    border-radius:50%;
    background: var(--crimson);
    box-shadow:0 2px 3px rgba(0,0,0,0.35);
  }
  @keyframes stickyPress{
    0%{ transform: scale(1); }
    40%{ transform: scale(0.86); }
    70%{ transform: scale(1.06); }
    100%{ transform: scale(1); }
  }
  .sticky-note.pressed{ animation: stickyPress 0.4s ease; }

  .note-zoom-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(30,18,14,0);
    opacity:0;
    pointer-events:none;
    transition: opacity 0.25s ease, background 0.25s ease;
  }
  .note-zoom-overlay.show{
    opacity:1;
    pointer-events:auto;
    background: rgba(30,18,14,0.45);
  }
  .note-zoom-card{
    width:76%;
    max-width:300px;
    max-height:85%;
    border-radius:10px;
    padding:20px 20px 16px;
    box-shadow: 0 22px 50px rgba(0,0,0,0.4);
    transform: scale(0.25);
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
    text-align:left;
    display:flex;
    flex-direction:column;
  }
  .note-zoom-overlay.show .note-zoom-card{ transform: scale(1); }
  .note-zoom-card .nz-title{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    color: var(--crimson);
    font-size:1rem;
    margin-bottom:8px;
    flex-shrink:0;
  }
  .note-zoom-card .nz-body{
    font-size:0.88rem;
    line-height:1.55;
    color: var(--cocoa-dark);
    overflow-y:auto;
    padding-right:4px;
  }
  .note-zoom-close{
    margin-top:14px;
    background: var(--crimson);
    color: var(--cream);
    padding:7px 18px;
    border-radius:999px;
    font-size:0.78rem;
    font-weight:700;
    flex-shrink:0;
    align-self:flex-start;
  }

  /* ----- claw machine modal (side view, 10 prizes per round) ----- */
  .claw-game{ text-align:center; }
  .claw-case-side{
    position:relative;
    height:190px;
    max-width:300px;
    margin:0 auto;
    background: linear-gradient(180deg, #FFF3D6, #FFE1A8);
    border-radius: var(--radius-md);
    overflow:hidden;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.4);
  }
  .claw-rail{
    position:absolute;
    top:8px; left:6%; right:6%;
    height:4px;
    background: var(--cocoa-dark);
    border-radius:2px;
  }
  .claw-unit{
    position:absolute;
    top:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transform: translateX(-50%);
    transition: left 0.35s ease;
  }
  .claw-string{
    width:2px;
    height:24px;
    background: var(--cocoa-dark);
    transition: height 0.5s ease;
  }
  .claw-unit.dropped .claw-string{ height:118px; }
  .claw-hand-icon{
    position:relative;
    width:38px; height:38px;
    margin-top:-2px;
  }
  .claw-svg{ width:100%; height:100%; overflow:visible; display:block; }
  .claw-svg .prong{ transition: transform 0.25s ease; transform-origin: 20px 13px; }
  .claw-svg.closed .prong-left{ transform: rotate(24deg); }
  .claw-svg.closed .prong-right{ transform: rotate(-24deg); }
  .held-prize{
    position:absolute;
    top:18px; left:50%;
    transform: translateX(-50%);
    font-size:0.95rem;
    opacity:0;
    transition: opacity 0.15s ease;
  }
  .held-prize.show{ opacity:1; }

  .floor-props{
    position:absolute;
    bottom:6px; left:0; right:0;
    height:36px;
  }
  .prop-item{
    position:absolute;
    bottom:0;
    font-size:1.15rem;
    transform: translateX(-50%);
    opacity:0.55;
  }
  .prop-item.back{
    font-size:0.9rem;
    bottom:13px;
    opacity:0.4;
  }
  .floor-prizes{
    position:absolute;
    bottom:10px; left:0; right:0;
    height:36px;
  }
  .floor-slot{
    position:absolute;
    bottom:0;
    font-size:1.4rem;
    transform: translateX(-50%);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .floor-slot.gone{ opacity:0; transform: translateX(-50%) scale(0.3); }
  .claw-progress{ text-align:center; font-size:0.8rem; color:var(--cocoa); margin-top:8px; }

  .side-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-top:14px;
  }
  .arrow-btn{
    width:44px; height:44px;
    border-radius:50%;
    background: var(--blush);
    color: var(--crimson);
    font-size:1.2rem;
    display:flex; align-items:center; justify-content:center;
  }
  .arrow-btn:active{ background: var(--rose); color:var(--cream); }
  .catch-btn{
    background: var(--crimson);
    color: var(--cream);
    font-family:'Fredoka', sans-serif;
    padding:12px 24px;
    border-radius:999px;
    font-size:0.92rem;
    box-shadow: var(--shadow-soft);
  }
  .catch-btn:disabled, .arrow-btn:disabled{ opacity:0.5; }

  .round-btn{
    display:block;
    margin:12px auto 0;
    background: none;
    color: var(--crimson);
    font-family:'Fredoka', sans-serif;
    font-size:0.82rem;
    text-decoration: underline;
    padding:4px;
  }

  .prize-toast{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(30,18,14,0);
    opacity:0;
    pointer-events:none;
    transition: opacity 0.25s ease, background 0.25s ease;
  }
  .prize-toast.show{ opacity:1; background: rgba(30,18,14,0.45); pointer-events:auto; }
  .prize-toast-card{
    background: var(--cream);
    border-radius:12px;
    padding:20px 22px;
    text-align:center;
    max-width:230px;
    box-shadow: 0 20px 46px rgba(0,0,0,0.4);
    transform: scale(0.35);
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .prize-toast.show .prize-toast-card{ transform: scale(1); }
  .prize-toast-emoji{ font-size:2.2rem; margin-bottom:8px; }
  .prize-toast-msg{ font-size:0.85rem; color: var(--cocoa-dark); line-height:1.45; margin-bottom:12px; }
  .prize-toast-close{
    background: var(--crimson);
    color: var(--cream);
    padding:6px 18px;
    border-radius:999px;
    font-size:0.78rem;
    font-weight:700;
  }

  .shelf-title{ margin-top:18px; font-weight:700; font-size:0.85rem; color:var(--cocoa); text-align:left; }
  .shelf{
    display:flex; flex-wrap:wrap; gap:6px;
    margin-top:8px;
    min-height:44px;
    max-height:140px;
    overflow-y:auto;
    background: var(--blush-soft);
    border-radius: var(--radius-sm);
    padding:10px;
  }
  .shelf-item{
    font-size:1.2rem;
    background: var(--cream);
    border-radius:8px;
    padding:5px 7px;
  }
  .shelf-empty{ font-size:0.8rem; color:var(--cocoa); }

  /* ----- bear letter modal ----- */
  .bear-letter-scene{
    position:relative;
    min-height:300px;
    display:flex;
    justify-content:center;
    padding-top:10px;
  }
  .envelope{
    position:relative;
    width:200px;
    height:130px;
    margin-top:34px;
    cursor:pointer;
    perspective:600px;
  }
  .envelope-body{
    position:absolute;
    inset:0;
    background: var(--blush-soft);
    border:2px solid var(--rose);
    border-radius:6px;
    z-index:1;
  }
  .envelope-flap{
    position:absolute;
    top:0; left:0;
    width:100%; height:65px;
    background: var(--rose);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 0.6s ease;
    z-index:3;
  }
  .envelope.open .envelope-flap{ transform: rotateX(150deg); }
  .envelope-hint{
    position:absolute;
    bottom:-24px; left:0; right:0;
    text-align:center;
    font-size:0.75rem;
    color: var(--cocoa);
  }
  .letter-paper{
    position:absolute;
    top:24px; left:50%;
    width:220px;
    max-height:0;
    overflow:hidden;
    transform: translateX(-50%) translateY(6px);
    background: var(--cream);
    border-radius:8px;
    box-shadow: 0 16px 34px rgba(0,0,0,0.32);
    padding:0 18px;
    opacity:0;
    transition: max-height 0.6s ease 0.3s, opacity 0.4s ease 0.3s, padding 0.6s ease 0.3s, transform 0.6s ease 0.3s;
    font-size:0.85rem;
    line-height:1.65;
    color: var(--cocoa-dark);
    white-space:pre-line;
    z-index:5;
  }
  .letter-paper.show{
    max-height:320px;
    overflow-y:auto;
    opacity:1;
    padding:20px 18px;
    transform: translateX(-50%) translateY(-46px);
  }
  .letter-pager{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-top:8px;
  }
  .letter-pager button{
    width:32px; height:32px;
    border-radius:50%;
    background: var(--blush);
    color: var(--crimson);
    font-size:0.9rem;
    display:flex; align-items:center; justify-content:center;
  }
  .letter-pager button:disabled{ opacity:0.3; }
  .letter-page-label{
    font-size:0.78rem;
    color: var(--cocoa);
    min-width:3em;
    text-align:center;
  }

  @media (max-width:560px){
    .shelf{ justify-content:center; }
  }
</style>
</head>

<script>
/* ================= LANDING -> SCENE ================= */
function attemptEnter(){
  const input = document.getElementById('cafe-password');
  const val = input.value.trim().toLowerCase();
  const err = document.getElementById('password-error');

  if(val === 'tite'){
    err.classList.add('hidden');
    enterCafe();
  } else {
    input.classList.remove('shake');
    void input.offsetWidth;
    input.classList.add('shake');
    err.classList.remove('hidden');
  }
}

function enterCafe(){
  const landing = document.getElementById('landing');
  landing.classList.add('opening');
  setTimeout(()=>{
    landing.classList.add('hidden');
    document.getElementById('cafe-scene').classList.remove('hidden');
  }, 650);
}

/* floating petals on the landing page */
(function petals(){
  const wrap = document.getElementById('petals');
  const blooms = ['🌸','🌷','✨'];
  for(let i=0;i<10;i++){
    const p = document.createElement('span');
    p.className='petal';
    p.textContent = blooms[i % blooms.length];
    p.style.left = (Math.random()*94)+'%';
    p.style.fontSize = (0.8 + Math.random()*0.9)+'rem';
    p.style.animationDuration = (7 + Math.random()*6)+'s';
    p.style.animationDelay = (Math.random()*8)+'s';
    wrap.appendChild(p);
  }
})();

/* ================= MODAL HELPERS ================= */
function openModal(html){
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.add('hidden');
  document.getElementById('modal-body').innerHTML = '';
}
document.getElementById('modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id==='modal-overlay') closeModal();
});

/* ================= STAR MAP ================= */
const starReasons = [
  "I love how smart you are — that clever, always-thinking mind of yours.",
  "The way you dress, your style, your curls — all so effortlessly you.",
  "How organized you are, always wanting to plan things out.",
  "How kind you are, even when you insist you're not. Deep down, you really are. Very Pisces of you.",
  "How firm you are about the things you like.",
  "How you make me smile, make me shy, make my heart flutter so effortlessly.",
  "I love your smile, the warmth in your gaze that pulls me in, that scent that drives me crazy, and your sweet, soft lips that seduce me.",
  "Honestly... just you."
];
const starPositions = [[12,18],[30,55],[50,25],[68,60],[80,20],[22,75],[45,45],[60,80]]; // [top%, left%]
const starSizes = [1.9, 1.1, 2.3, 1.3, 1.7, 1.0, 1.6, 2.0]; // rem, varied like real star brightness
const constellationName = "Jirah Minor";
const constellationSub = "a constellation that only shows up when someone really notices you.";

function openStarMap(){
  let starsHtml = '';
  starPositions.forEach((pos,i)=>{
    const [top,left] = pos;
    const foundClass = starsFound.has(i) ? 'found' : '';
    starsHtml += `<button class="star-btn ${foundClass}" style="top:${top}%; left:${left}%; font-size:${starSizes[i]}rem" data-i="${i}" onclick="pickStar(${i}, this)">✦</button>`;
  });

  let bgHtml = '';
  for(let b=0;b<22;b++){
    const top = Math.random()*96;
    const left = Math.random()*96;
    const size = 0.3 + Math.random()*0.5;
    const dur = 2 + Math.random()*3;
    const delay = Math.random()*4;
    bgHtml += `<span class="bg-star" style="top:${top}%; left:${left}%; font-size:${size}rem; animation-duration:${dur}s; animation-delay:${delay}s">✦</span>`;
  }

  openModal(`
    <h3>The Star Map</h3>
    <p class="modal-sub">Tap a star. Each one is something I like about you.</p>
    <div class="starmap-box" id="starmap-box">
      <svg class="constellation-svg" id="constellation-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      ${bgHtml}
      ${starsHtml}
    </div>
    <div class="star-caption" id="star-caption">${starsFound.size ? starReasons[[...starsFound].pop()] : 'Tap a star to begin.'}</div>
    <div class="star-progress" id="star-progress">${starsFound.size} / ${starReasons.length} stars found</div>
    <div class="constellation-reveal ${starsFound.size===starReasons.length?'show':''}" id="constellation-reveal">
      <div class="c-name">✨ ${constellationName} ✨</div>
      <div class="c-sub">${constellationSub}</div>
    </div>
  `);
  redrawConstellationLines();
}

let starsFound = new Set();
let starOrder = [];

function pickStar(i, el){
  if(starsFound.has(i)) return;
  el.classList.add('found');
  starsFound.add(i);
  starOrder.push(i);

  document.getElementById('star-caption').textContent = starReasons[i];
  document.getElementById('star-progress').textContent = `${starsFound.size} / ${starReasons.length} stars found`;

  if(starOrder.length > 1){
    drawLine(starOrder[starOrder.length-2], starOrder[starOrder.length-1], true);
  }

  if(starsFound.size === starReasons.length){
    document.getElementById('constellation-reveal').classList.add('show');
  }
}

function drawLine(fromIdx, toIdx, animate){
  const svg = document.getElementById('constellation-svg');
  const [y1,x1] = starPositions[fromIdx];
  const [y2,x2] = starPositions[toIdx];
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  svg.appendChild(line);

  if(!animate) return;

  const len = line.getTotalLength();
  line.style.strokeDasharray = len;
  line.style.strokeDashoffset = len;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      line.style.transition = 'stroke-dashoffset 0.8s ease';
      line.style.strokeDashoffset = 0;
    });
  });
}

function redrawConstellationLines(){
  for(let k=1;k<starOrder.length;k++){
    drawLine(starOrder[k-1], starOrder[k], false);
  }
}

/* ================= MIXTAPE (two tabbed playlists, real playback via relative audio paths) ================= */
const playlists = {
  main: {
    label: "Main Track - J's Playlist",
    tracks: [
      { title:"Helena", artist:"My Chemical Romance", caption:"It will always remind me of how we missed our chance together in this life — leaving us to mourn a future that only existed in our heads.", src:"audio/j-track1.mp3" },
      { title:"King for a Day (ft. Kellin Quinn)", artist:"Pierce the Veil", caption:"The agony of the \"almost\" — tasting what could be, only to have it stripped away by reality.", src:"audio/j-track2.mp3" },
      { title:"Caraphernelia", artist:"Pierce the Veil", caption:"In such a short span of time, there are already so many memories of you that I'll keep with me.", src:"audio/j-track3.mp3" },
      { title:"I'm Not Okay (I Promise)", artist:"My Chemical Romance", caption:"It will always haunt me, thinking that someday there will be someone else you'll spend the rest of your life with.", src:"audio/j-track4.mp3" },
      { title:"Disenchanted", artist:"My Chemical Romance", caption:"Makes me think of \"what could have been\" — struck down by bad timing and life getting in the way. Even the universe seems to say you deserved better.", src:"audio/j-track5.mp3" },
      { title:"A Match Into Water", artist:"Pierce the Veil", caption:"This intense spark of dreaming a future with you, easily drowned by harsh reality. I adore you so much, even knowing I can't truly have you.", src:"audio/j-track6.mp3" }
    ]
  },
  bside: {
    label: "B Side - E's Playlist",
    tracks: [
      { title:"Be Your Everything", artist:"Boys Like Girls", caption:"My wishful thinking — that I could pour all of myself into keeping you happy and safe for the rest of my life.", src:"audio/e-track1.mp3" },
      { title:"Two Is Better Than One", artist:"Boys Like Girls", caption:"You said I already lived thirty years without you — but I don't know if I can live another thirty without you.", src:"audio/e-track2.mp3" },
      { title:"Heartache", artist:"ONE OK ROCK", caption:"This one is a total heartbreak for me.", src:"audio/e-track3.mp3" },
      { title:"Ikaw Pa Rin (Acoustic)", artist:"Letter Day Story", caption:"Kahit lumipas ang panahon, palagi pa rin kitang maaalala, maiisip, at hahanapin.", src:"audio/e-track4.mp3" },
      { title:"Tanging Hiling pt. 2 (ft. Smugglaz)", artist:"Curse One", caption:"My favorite part is the line about wishing on the stars that pass by — and you being the only wish I have.", src:"audio/e-track5.mp3" },
      { title:"Baliw", artist:"SUD", caption:"Even now, I catch myself smiling at just the memory of you.", src:"audio/e-track6.mp3" }
    ]
  }
};
let activePlaylist = 'main';
let currentTrack = -1;
let mixtapeAudio = null;

function openMixtape(){
  activePlaylist = 'main';
  currentTrack = -1;
  renderMixtape();
}

function renderMixtape(){
  const tracks = playlists[activePlaylist].tracks;

  let tabsHtml = Object.keys(playlists).map(key => `
    <button class="mixtape-tab ${key === activePlaylist ? 'active' : ''}" onclick="switchPlaylist('${key}')">${playlists[key].label}</button>
  `).join('');

  let rows = tracks.map((t,i)=>`
    <div class="track-row" id="track-row-${i}">
      <div class="track-play" id="track-play-${i}" onclick="playTrack(${i})">▶</div>
      <div class="track-meta">
        <div class="t-title">${t.title}</div>
        <div class="t-artist">${t.artist}</div>
      </div>
      <div class="eq hidden" id="eq-${i}"><span></span><span></span><span></span></div>
    </div>
  `).join('');

  openModal(`
    <h3>Her Mixtape</h3>
    <p class="modal-sub">Songs she'd like, each with a little note attached.</p>
    <div class="mixtape-tabs">${tabsHtml}</div>
    ${rows}
    <div class="now-caption" id="now-caption">Pick a track to see its note.</div>
    <div class="track-progress-wrap hidden" id="track-progress-wrap">
      <div class="track-progress-bar" id="track-progress-bar" onclick="seekTrack(event)">
        <div class="track-progress-fill" id="track-progress-fill"></div>
      </div>
      <div class="track-time" id="track-time">0:00 / 0:00</div>
    </div>
    <audio id="mixtape-audio" preload="none"></audio>
  `);

  mixtapeAudio = document.getElementById('mixtape-audio');
  mixtapeAudio.addEventListener('play', ()=> setEqState(true));
  mixtapeAudio.addEventListener('pause', ()=> setEqState(false));
  mixtapeAudio.addEventListener('ended', ()=> setEqState(false));
  mixtapeAudio.addEventListener('timeupdate', updateProgressUI);
  mixtapeAudio.addEventListener('loadedmetadata', updateProgressUI);
}

function switchPlaylist(key){
  if(key === activePlaylist) return;
  if(mixtapeAudio) mixtapeAudio.pause();
  activePlaylist = key;
  currentTrack = -1;
  renderMixtape();
}

function setEqState(isPlaying){
  if(currentTrack < 0) return;
  document.getElementById(`eq-${currentTrack}`).classList.toggle('hidden', !isPlaying);
  document.getElementById(`track-play-${currentTrack}`).textContent = isPlaying ? '⏸' : '▶';
}

function playTrack(i){
  if(!mixtapeAudio) return;
  const tracks = playlists[activePlaylist].tracks;

  if(i === currentTrack){
    // same track: toggle play/pause
    if(mixtapeAudio.paused){ mixtapeAudio.play().catch(()=>{}); }
    else { mixtapeAudio.pause(); }
    return;
  }

  // switching tracks
  tracks.forEach((_,j)=>{
    document.getElementById(`track-row-${j}`).classList.remove('active');
    document.getElementById(`eq-${j}`).classList.add('hidden');
    document.getElementById(`track-play-${j}`).textContent = '▶';
  });

  currentTrack = i;
  document.getElementById(`track-row-${i}`).classList.add('active');
  document.getElementById('now-caption').textContent = tracks[i].caption;
  document.getElementById('track-progress-wrap').classList.remove('hidden');

  mixtapeAudio.src = tracks[i].src;
  mixtapeAudio.currentTime = 0;
  mixtapeAudio.play().catch(()=>{
    // file not found / can't play yet (e.g. still using placeholder paths) — fail quietly
  });
}

function formatTime(s){
  if(!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

function updateProgressUI(){
  if(!mixtapeAudio) return;
  const fill = document.getElementById('track-progress-fill');
  const time = document.getElementById('track-time');
  if(!fill || !time) return;
  const pct = mixtapeAudio.duration ? (mixtapeAudio.currentTime / mixtapeAudio.duration) * 100 : 0;
  fill.style.width = pct + '%';
  time.textContent = `${formatTime(mixtapeAudio.currentTime)} / ${formatTime(mixtapeAudio.duration)}`;
}

function seekTrack(e){
  if(!mixtapeAudio || !mixtapeAudio.duration) return;
  const bar = document.getElementById('track-progress-bar');
  const rect = bar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  mixtapeAudio.currentTime = pct * mixtapeAudio.duration;
}

const ROUND_SIZE = 4;
const REAL_SLOT_POS = [14, 38, 62, 86]; // left% anchors for the real catchable slots
const PROP_ANCHORS = [3, 10, 19, 27, 33, 44, 50, 56, 68, 74, 80, 90, 97]; // left% anchors for decorative filler only

let currentProps = [];
let currentRealJitter = [];

function randomPropEmoji(){
  return prizeEmojis[Math.floor(Math.random() * prizeEmojis.length)];
}
function generateProps(){
  return PROP_ANCHORS.map(anchor => ({
    left: anchor + (Math.random() * 6 - 3),
    rot: (Math.random() * 34 - 17).toFixed(1),
    bottom: Math.floor(Math.random() * 12),
    emoji: randomPropEmoji(),
    back: Math.random() < 0.45
  }));
}
function generateRealJitter(){
  return REAL_SLOT_POS.map(()=>({ bottom: Math.floor(Math.random() * 8) }));
}

let roundSlots = [];   // array of prize indices (or null once caught), current round
let clawSlot = 0;      // which slot (0..roundSlots.length-1) the claw is over
let clawCollected = new Set(); // overall collected indices across all rounds
let clawOrder = [];    // order caught, for shelf
let clawBusy = false;

function shuffleArr(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startNewRound(){
  const remaining = shuffleArr(prizePool.map((_,i)=>i).filter(i=>!clawCollected.has(i)));
  roundSlots = remaining.slice(0, ROUND_SIZE);
  clawSlot = 0;
  currentProps = generateProps();
  currentRealJitter = generateRealJitter();
}

function openClaw(){
  if(roundSlots.filter(s=>s!==null).length === 0){
    startNewRound();
  }
  renderClaw();
}

function renderClaw(){
  const allDone = clawCollected.size >= prizePool.length;

  let bodyHtml;
  if(allDone){
    bodyHtml = `<div class="claw-progress" style="margin-top:60px; font-size:0.95rem;">✨ You caught all 50! ✨</div>`;
  } else {
    let floorHtml = roundSlots.map((idx, i)=>{
      const left = REAL_SLOT_POS[i];
      const bottom = currentRealJitter[i] ? currentRealJitter[i].bottom : 0;
      if(idx === null) return `<div class="floor-slot gone" id="floor-slot-${i}" style="left:${left}%; bottom:${bottom}px"></div>`;
      return `<div class="floor-slot" id="floor-slot-${i}" style="left:${left}%; bottom:${bottom}px">${prizePool[idx].emoji}</div>`;
    }).join('');

    let propsHtml = currentProps.map(p=>`<div class="prop-item ${p.back ? 'back' : ''}" style="left:${p.left}%; bottom:${p.bottom}px; transform:translateX(-50%) rotate(${p.rot}deg)">${p.emoji}</div>`).join('');

    bodyHtml = `
      <div class="claw-case-side" id="claw-case-side">
        <div class="claw-rail"></div>
        <div class="claw-unit" id="claw-unit">
          <div class="claw-string" id="claw-string"></div>

  let shelfHtml = clawOrder.length
    ? clawOrder.map(i=>`<div class="shelf-item" onclick="reviewPrize(${i})">${prizePool[i].emoji}</div>`).join('')

function updateClawPosition(animated){
  const unit = document.getElementById('claw-unit');
  if(!unit) return;
  const pct = REAL_SLOT_POS[clawSlot];
  unit.style.transition = animated === false ? 'none' : 'left 0.35s ease';
  unit.style.left = pct + '%';
}

function moveClaw(dir){
  if(clawBusy) return;
  clawSlot = Math.min(roundSlots.length - 1, Math.max(0, clawSlot + dir));
  updateClawPosition(true);
}

function wait(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function catchPrize(){
  if(clawBusy) return;
  clawBusy = true;
  const btn = document.getElementById('catch-btn');
  btn.disabled = true;

  const unit = document.getElementById('claw-unit');
  const svg = document.getElementById('claw-svg');
  const held = document.getElementById('held-prize');

  // 1. descend, claw open
  unit.classList.add('dropped');
  await wait(520);

  // 2. grab: close the claw on whatever is there
  const idx = roundSlots[clawSlot];
  svg.classList.add('closed');
  if(idx !== null && idx !== undefined){
    const slotEl = document.getElementById(`floor-slot-${clawSlot}`);
    if(slotEl) slotEl.classList.add('gone');
    held.textContent = prizePool[idx].emoji;
    held.classList.add('show');
    roundSlots[clawSlot] = null;
    clawCollected.add(idx);
    clawOrder.push(idx);
  }
  await wait(400); // hold the grab so it's clearly seen before rising

  // 3. rise, still closed (holding the prize)
  unit.classList.remove('dropped');
  await wait(560);
  await wait(120); // brief settle at the top before releasing

  // 4. open motion: release the prize
  svg.classList.remove('closed');
  held.classList.remove('show');
  held.textContent = '';

  if(idx !== null && idx !== undefined){
    document.querySelector('.claw-progress').textContent = `${clawCollected.size} / ${prizePool.length} caught overall`;
    const shelf = document.getElementById('shelf');
    if(shelf) shelf.innerHTML = clawOrder.map(i=>`<div class="shelf-item" onclick="reviewPrize(${i})">${prizePool[i].emoji}</div>`).join('');
    showPrizeToast(idx);
  }

  clawBusy = false;
  btn.disabled = false;
}

function reshuffleRound(){
  if(clawBusy) return;
  startNewRound();
  renderClaw();
}

function showPrizeToast(i){
  const p = prizePool[i];
  document.getElementById('pt-emoji').textContent = p.emoji;
  document.getElementById('pt-msg').textContent = p.msg;
  document.getElementById('prize-toast').classList.add('show');
}

function reviewPrize(i){
  showPrizeToast(i);
}

function closeToast(e){
  e.stopPropagation();
  document.getElementById('prize-toast').classList.remove('show');
}
function closeToastBackdrop(e){
  if(e.target.id === 'prize-toast'){
    document.getElementById('prize-toast').classList.remove('show');
  }
}

let letterOpened = false;
let currentLetterIndex = 0;

function openBearLetter(){
  letterOpened = false;
  currentLetterIndex = 0;
  openModal(`
    <h3>Letters From Her</h3>
    <p class="modal-sub">Tap the envelope to open it.</p>
    <div class="bear-letter-scene">
      <div class="envelope" id="bear-envelope" onclick="openLetterAnim()">
        <div class="envelope-flap"></div>
        <div class="envelope-body"></div>
        <div class="envelope-hint" id="envelope-hint">tap to open</div>
      </div>
      <div class="letter-paper" id="bear-letter-paper"></div>
    </div>
    <div class="letter-pager hidden" id="letter-pager">
      <button id="letter-prev" onclick="changeLetter(-1)">◀</button>
      <span class="letter-page-label" id="letter-page-label">1 / ${bearLetters.length}</span>
      <button id="letter-next" onclick="changeLetter(1)">▶</button>
    </div>
  `);
  document.getElementById('bear-letter-paper').textContent = bearLetters[0];
}

function openLetterAnim(){
  if(letterOpened) return;
  letterOpened = true;
  document.getElementById('bear-envelope').classList.add('open');
  document.getElementById('envelope-hint').style.display = 'none';
  setTimeout(()=>{
    document.getElementById('bear-letter-paper').classList.add('show');
    document.getElementById('letter-pager').classList.remove('hidden');
    updateLetterPagerUI();
  }, 300);
}

function changeLetter(dir){
  const next = currentLetterIndex + dir;
  if(next < 0 || next >= bearLetters.length) return;
  currentLetterIndex = next;
  const paper = document.getElementById('bear-letter-paper');
  paper.textContent = bearLetters[currentLetterIndex];
  paper.scrollTop = 0;
  updateLetterPagerUI();
}

function updateLetterPagerUI(){
  document.getElementById('letter-page-label').textContent = `${currentLetterIndex + 1} / ${bearLetters.length}`;
  document.getElementById('letter-prev').disabled = currentLetterIndex === 0;
  document.getElementById('letter-next').disabled = currentLetterIndex === bearLetters.length - 1;
}
</script>
